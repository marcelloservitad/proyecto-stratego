<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stratego - Battlefield Scene</title>
    <link rel="stylesheet" href="css/battlefield.css">
</head>
<body>

    <div class="battle-scene-wrapper">
        <header class="game-header">
            <div class="player-info">
                <div class="enemy-avatar"></div>
                <div class="enemy-details">
                    <h3 class="enemy-name">GENERAL ENEMIGO</h3>
                    <small class="enemy-status">Estado: En espera de movimiento</small>
                </div>
            </div>

            <div class="turn-timer">
                <div class="timer-label">TURNO ACTUAL</div>
                <div class="timer-value" id="turn-display">TU TURNO</div>
            </div>

            <div class="captured-counter">
                <small>Piezas Capturadas</small>
                <div id="enemy-captured-count" class="counter-num">0</div>
            </div>
        </header>

        <main class="battle-main">
            <section class="board-container">
                <div id="battlefield" class="battlefield-grid">
                    </div>
            </section>

            <aside class="battle-sidebar">
                <div class="log-container">
                    <h4>HISTORIAL DE COMBATE</h4>
                    <div id="battle-log" class="log-messages">
                        <p class="system-msg">[Sistema]: La batalla ha comenzado.</p>
                        <p class="system-msg">[Sistema]: Mueve una pieza para iniciar el ataque.</p>
                    </div>
                </div>

                <div class="inventory-status">
                    <h4>ESTADO DE TU EJÉRCITO</h4>
                    <div class="mini-status-grid">
                        <div class="status-item">
                            <span>VIVAS</span>
                            <strong id="alive-count">40</strong>
                        </div>
                        <div class="status-item">
                            <span>BAJAS</span>
                            <strong id="dead-count">0</strong>
                        </div>
                    </div>
                </div>

                <button class="btn-surrender">RETIRADA TÁCTICA</button>
            </aside>
        </main>
    </div>

    <script src="js/battefield.js"></script>
</body>
</html>
