<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stratego - Club de Oficiales</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/lobby.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🪖 Stratego - Club de Oficiales</h1>
            <nav class="user-info">
                <span id="username">General Anónimo</span>
                <button id="logout-btn" class="btn-exit">Salir</button>
            </nav>
        </header>

        <main class="lobby-container">
            <aside class="players-panel">
                <h2>🟢 Oficiales Conectados</h2>
                <ul class="players-list" id="players-list">
                    </ul>
                
                <footer class="actions">
                    <button id="pve-btn" class="btn-primary">🎮 Entrenamiento PvE</button>
                    <div class="pve-options hidden" id="pve-options">
                        <select id="pve-mode">
                            <option value="classic">Guerra Clásica (40 piezas)</option>
                            <option value="quick">Duelo Rápido (10 piezas)</option>
                        </select>
                        <button id="start-pve">Iniciar Entrenamiento</button>
                    </div>
                </footer>
            </aside>

            <section class="chat-panel">
                <h2>💬 Comunicaciones Globales</h2>
                <article class="chat-box">
                    <div class="chat-messages" id="chat-messages" role="log">
                        </div>
                    <form class="chat-input" id="chat-form" onsubmit="return false;">
                        <input type="text" id="message-input" placeholder="Escribe tu mensaje o desafío..." aria-label="Mensaje de chat">
                        <button type="submit" id="send-message">Enviar</button>
                    </form>
                </article>
                
                <footer class="protocol-indicator">
                    <p>Protocolo Actual: <strong id="protocol-display">WebSocket Activo</strong></p>
                </footer>
            </section>
        </main>

        <section id="challenge-modal" class="modal hidden" role="dialog" aria-labelledby="modal-title">
            <div class="modal-content">
                <h2 id="modal-title">🎯 Desafiar a <span id="opponent-name"></span></h2>
                <fieldset class="challenge-options">
                    <legend>Selecciona la modalidad:</legend>
                    <label>
                        <input type="radio" name="game-mode" value="classic" checked> Guerra Clásica (40 piezas)
                    </label>
                    <label>
                        <input type="radio" name="game-mode" value="quick"> Duelo Rápido (10 piezas)
                    </label>
                </fieldset>
                <footer class="modal-footer">
                    <button id="send-challenge" class="btn-primary">Enviar Desafío</button>
                    <button id="cancel-challenge" class="btn-secondary">Cancelar</button>
                </footer>
            </div>
        </section>

        <footer class="connection-status" id="connection-status">
            <span class="status-dot connected"></span>
            <span>Conectado</span>
        </footer>
    </div>

    <script src="js/communication.js"></script>
    <script src="js/lobby.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
