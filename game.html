<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stratego - En Batalla</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/game.css">
    <style>
        /* Estilos temporales para debugging */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .app-header {
            flex-shrink: 0;
            padding: 0.5rem 1rem;
        }
        
        .app-header h1 {
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        #game-player-name {
            font-size: 0.9rem;
        }
        
        .btn-exit {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>⚔️ Stratego - En Batalla</h1>
            <div class="user-info">
                <span id="game-player-name">General</span>
                <button id="game-logout-btn" class="btn-exit">Salir</button>
            </div>
        </header>

        <main class="game-container">
            <div class="game-main">
                <!-- Tablero de juego -->
                <section class="game-board">
                    <h2>Campo de Batalla</h2>
                    <div class="board-full" id="game-board">
                        <!-- 10x10 celdas generadas por JavaScript -->
                    </div>
                    <div class="board-legend">
                        <div class="legend-item lake">🌊 Lago</div>
                        <div class="legend-item player-territory">🔵 Tu territorio</div>
                        <div class="legend-item opponent-territory">🔴 Territorio enemigo</div>
                    </div>
                </section>

                <!-- Sidebar derecho -->
                <div class="game-sidebar">
                    <!-- Panel de información -->
                    <aside class="game-info-panel">
                        <div class="turn-indicator" id="turn-indicator">
                            🎮 TU TURNO
                        </div>
                        
                        <div class="player-stats">
                            <div class="stat-item">
                                <span class="stat-value" id="player-pieces-count">40</span>
                                <span class="stat-label">Tus piezas</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-value" id="opponent-pieces-count">40</span>
                                <span class="stat-label">Enemigas</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-value" id="game-timer">00:00</span>
                                <span class="stat-label">Tiempo</span>
                            </div>
                        </div>

                        <div class="protocol-display-game" id="game-protocol-display">
                            Protocolo: WebSockets Activo
                        </div>

                        <!-- Historial de movimientos -->
                        <div class="move-history-container">
                            <h3>📜 Historial de Movimientos</h3>
                            <div class="move-history" id="move-history">
                                <!-- Movimientos se agregarán aquí -->
                            </div>
                        </div>
                    </aside>

                    <!-- Chat de juego -->
                    <section class="game-chat">
                        <h3>💬 Chat de Batalla</h3>
                        <div class="chat-messages" id="game-chat-messages">
                            <div class="message system">
                                [Sistema]: La batalla ha comenzado. ¡Buena suerte!
                            </div>
                        </div>
                        <div class="chat-input">
                            <input type="text" id="game-chat-input" placeholder="Escribe un mensaje...">
                            <button id="send-game-chat">Enviar</button>
                        </div>
                    </section>
                </div>
            </div>

            <!-- Controles del juego -->
           <section class="game-controls">
    <div class="control-buttons">
        <button id="reveal-opponent-btn" class="btn-secondary">👁️ VER PIEZAS ENEMIGAS</button>
        <button id="surrender-btn" class="btn-danger">🏳️ Rendirse</button>
        <button id="offer-draw-btn" class="btn-secondary">🤝 Tablas</button>
        <button id="save-game-btn" class="btn-secondary">💾 Guardar</button>
        <button id="toggle-protocol-btn" class="btn-secondary">🔄 Protocolo</button>
    </div>
    
    <div class="game-status">
        <span id="game-status-text">En curso</span>
        <span class="connection-indicator connected"></span>
    </div>
</section>
        </main>

        <!-- Modal de información de pieza -->
        <div id="piece-info" class="piece-info-modal hidden"></div>
        
        <!-- Modal de combate -->
        <div id="combat-modal" class="modal hidden"></div>
        
        <!-- Modal de fin de juego -->
        <div id="game-over-modal" class="modal hidden"></div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/communication.js"></script>
    <script src="js/pieces.js"></script>
    <script src="js/game.js"></script>
    
   <script>
    // Código de inicialización corregido
    document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM cargado, inicializando juego...');
        
        // Verificar que game.js se cargó correctamente
        try {
            // Inicializar el juego directamente
            if (typeof initializeGame === 'function') {
                initializeGame();
                console.log('Juego inicializado correctamente');
                
                // Configurar botón de salida
                const logoutBtn = document.getElementById('game-logout-btn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', function() {
                        if (confirm('¿Salir del juego? Se perderá el progreso actual.')) {
                            localStorage.removeItem('current_game');
                            localStorage.removeItem('game_deployment');
                            window.location.href = 'index.html';
                        }
                    });
                }
                
                // Cargar nombre de usuario
                const savedUser = localStorage.getItem('stratego_user');
                if (savedUser) {
                    try {
                        const user = JSON.parse(savedUser);
                        const playerNameEl = document.getElementById('game-player-name');
                        if (playerNameEl && user.username) {
                            playerNameEl.textContent = user.username;
                        }
                    } catch (e) {
                        console.error('Error al cargar usuario:', e);
                    }
                }
            } else {
                throw new Error('game.js no se cargó correctamente');
            }
        } catch (error) {
            console.error('Error al inicializar el juego:', error);
            alert('Error: El juego no se pudo cargar. Verifica los archivos JavaScript.');
        }
    });
    
    // Función para mostrar mensajes de depuración
    window.showDebugInfo = function() {
        console.log('=== DEBUG INFO ===');
        console.log('gameState:', window.gameState);
        console.log('initializeGame existe:', typeof initializeGame);
        console.log('Board:', document.getElementById('game-board'));
        console.log('LocalStorage deployment:', localStorage.getItem('game_deployment'));
        console.log('LocalStorage current_game:', localStorage.getItem('current_game'));
        console.log('==================');
    };
    
    // Llamar a debug después de 2 segundos para verificar
    setTimeout(window.showDebugInfo, 2000);
</script>
</body>
</html>
