<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stratego - Cuarto de Guerra</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/config.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>⚔️ Cuarto de Guerra - Despliegue Táctico</h1>
            <div class="game-info">
                <span id="game-mode-display"></span>
                <span id="opponent-info"></span>
            </div>
        </header>

        <main class="config-container">
            <!-- Tablero de despliegue -->
            <section class="deployment-board">
                <h2>Tu Territorio</h2>
                <div class="board-grid" id="player-board">
                    <!-- 10x4 celdas para el despliegue inicial -->
                </div>
                <div class="board-legend">
                    <div class="legend-item lake">Lago (No transitable)</div>
                    <div class="legend-item valid">Casilla válida</div>
                    <div class="legend-item occupied">Ocupada</div>
                </div>
            </section>

            <!-- Inventario de piezas -->
            <section class="pieces-inventory">
                <h2>Tu Ejército</h2>
                <div class="inventory-controls">
                    <button id="randomize-btn" class="btn-secondary">
                        🎲 Despliegue Aleatorio
                    </button>
                    <button id="save-formation-btn" class="btn-secondary">
                        💾 Guardar Formación
                    </button>
                    <button id="load-formation-btn" class="btn-secondary">
                        📂 Cargar Formación
                    </button>
                </div>
                <div class="pieces-list" id="pieces-list">
                    <!-- Piezas disponibles para arrastrar -->
                </div>
                <div class="formation-selector">
                    <select id="saved-formations">
                        <option value="">Formaciones guardadas...</option>
                    </select>
                </div>
            </section>

            <!-- Panel de chat y controles -->
            <section class="config-controls">
                <div class="chat-private" id="private-chat">
                    <h3>💬 Comunicaciones Privadas</h3>
                    <div class="chat-messages" id="private-chat-messages"></div>
                    <div class="chat-input">
                        <input type="text" id="private-message-input" 
                               placeholder="Mensaje para el oponente...">
                        <button id="send-private-message">Enviar</button>
                    </div>
                </div>
                
                <div class="ready-section">
                    <div class="status-indicators">
                        <div class="status-item">
                            <span class="status-label">Tu estado:</span>
                            <span id="player-status" class="status-value not-ready">
                                ❌ No listo
                            </span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">Oponente:</span>
                            <span id="opponent-status" class="status-value not-ready">
                                ❌ No listo
                            </span>
                        </div>
                    </div>
                    
                    <button id="ready-btn" class="btn-success btn-large">
                        ⚡ MARCAR COMO LISTO
                    </button>
                    
                    <button id="cancel-game" class="btn-danger">
                        🏳️ Retirarse
                    </button>
                    
                    <div class="protocol-info">
                        <strong>Protocolo principal:</strong>
                        <code id="main-protocol"></code>
                        <br>
                        <strong>Protocolo secundario:</strong>
                        <code id="secondary-protocol"></code>
                    </div>
                </div>
            </section>
        </main>

        <!-- Modal de formaciones guardadas -->
        <div id="formations-modal" class="modal hidden">
            <div class="modal-content">
                <h2>📚 Formaciones Guardadas</h2>
                <div class="formations-list" id="saved-formations-list"></div>
                <div class="modal-footer">
                    <button class="btn-secondary" onclick="closeFormationsModal()">
                        Cerrar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/communication.js"></script>
    <script src="js/pieces.js"></script>
    <script src="js/config.js"></script>
</body>
</html>
